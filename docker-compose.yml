services:
  mongo:
    image: mongo:4.4
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: ai_data_store

  api:
    build: .
    restart: unless-stopped
    ports:
      - "8742:8742"
    environment:
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: ai_data_store
      API_KEY: ${API_KEY}
      UI_USERNAME: ${UI_USERNAME:-admin}
      UI_PASSWORD: ${UI_PASSWORD}
    depends_on:
      - mongo

  web:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "app.web"]
    ports:
      - "8743:8743"
    environment:
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: ai_data_store
      API_KEY: ${API_KEY}
      UI_USERNAME: ${UI_USERNAME:-admin}
      UI_PASSWORD: ${UI_PASSWORD}
    depends_on:
      - mongo

volumes:
  mongo_data:
